services:
  mysql:
    image: mysql:9.7
    container_name: resolve-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - resolve-mysql-data:/var/lib/mysql

  redis:
    image: redis:8-alpine
    container_name: resolve-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.4-management
    container_name: resolve-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - resolve-rabbitmq-data:/var/lib/rabbitmq

volumes:
  resolve-mysql-data:
    external: true

  resolve-rabbitmq-data: